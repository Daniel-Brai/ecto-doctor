name: Publish

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    # Protect this environment on GitHub to choose who can publish
    environment: hex
    concurrency: publish

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Check the tag matches the version in mix.exs
        run: grep -qF "@version \"${GITHUB_REF_NAME#v}\"" mix.exs

      - run: mix deps.get

      - name: Publish the package and its docs
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
